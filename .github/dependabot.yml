# Weekly dependency updates. Minor and patch bumps come as one pull request
# per ecosystem; major bumps come one pull request each, since they can
# break. Security updates (when enabled in the repository settings) are not
# grouped and arrive as soon as they exist.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/web, /app]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    # @types/node follows the Node.js major the project runs on (22).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The workflows pin actions to commit SHAs; Dependabot moves the SHA and
  # its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
