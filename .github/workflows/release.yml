name: Release

# Push a tag `vX.Y.Z` matching the workspace version. The workflow builds the
# standalone CLI archives and the desktop app (portable assets for
# install.sh / install.ps1 / `blirp update`: `blirp_<ver>_<arch>.app.tar.gz`,
# `blirp_<ver>_x64-portable.zip`, `blirp_<ver>_<arch>.AppImage`; plus the
# NSIS/MSI/DMG/deb/rpm installers), uploads them to a DRAFT release with
# SHA256SUMS.txt and its minisign signature SHA256SUMS.txt.sig, and renders
# the Homebrew / winget manifests. Publish the draft by hand after checking
# it: the install scripts and `blirp update` only see published releases
# (`releases/latest` skips drafts and prereleases).
#
# Secrets (see docs/development.md): TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD)
# are required (they sign SHA256SUMS.txt; the public key is
# packaging/minisign.pub). Only the `sign` job sees them: it checks out no
# code and installs no packages, it runs a pinned minisign release binary
# over the checksums of an explicit list of asset names. Code signing is
# optional and runs only when its secrets exist:
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            notarization: APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows: Azure Artifact Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#            AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
#            or a certificate: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#
# Supply chain: every action is pinned to a commit (Dependabot proposes
# bumps), tools are installed at fixed versions, the Rust toolchain comes
# from rust-toolchain.toml, and no build cache is restored into these jobs.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: each job asks for what it needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PNPM_VERSION: "12.7.0"
  # The release signer: minisign's own release, checked against this hash
  # (its minisign signature by the author was verified when it was pinned).
  MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
  MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tag matches the workspace version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create (or reuse) the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "blirp ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          echo "id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI ${{ matrix.target }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No caches (cargo or pnpm) here: release assets are built from a clean tree.
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target "$TARGET"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build web UI
        run: |
          pnpm -C web install --frozen-lockfile --ignore-scripts
          pnpm -C web build

      - name: Build blirp (unix)
        if: runner.os != 'Windows'
        run: SKIP_WEB=1 sh scripts/build-sidecar.sh "$TARGET"
      - name: Build blirp + ConPTY (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build-sidecar.ps1 -Target $env:TARGET -SkipWeb

      - name: Sign and notarize (macOS, when configured)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE not set; the macOS CLI binary is unsigned"
            exit 0
          fi
          bin="app/src-tauri/binaries/blirp-$TARGET"
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 # one keychain path per word
          security list-keychains -d user -s "$kc" $existing
          rm -f "$RUNNER_TEMP/cert.p12"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          if [ -n "$APPLE_ID" ]; then
            ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          fi

      - name: Sign (Windows, when configured)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "app/src-tauri/binaries/blirp-$env:TARGET.exe"
          if ($env:AZURE_CLIENT_SECRET) {
            cargo install trusted-signing-cli --locked --version 0.11.0
            trusted-signing-cli -e $env:AZURE_SIGNING_ENDPOINT -a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE -d blirp $bin
            if ($LASTEXITCODE -ne 0) { throw 'Azure Artifact Signing failed' }
          } elseif ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            [IO.File]::Delete($pfx)
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /sha1 $cert.Thumbprint /fd sha256 /tr http://timestamp.digicert.com /td sha256 $bin
            if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
          } else {
            Write-Output '::warning::no Windows signing secrets; the Windows CLI binary is unsigned'
          }

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          name="blirp-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "app/src-tauri/binaries/blirp-$TARGET" "dist/$name/blirp"
          cp LICENSE README.md "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "blirp-$env:VERSION-$env:TARGET"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force "$dir/x64" | Out-Null
          Copy-Item "app/src-tauri/binaries/blirp-$env:TARGET.exe" "$dir/blirp.exe"
          Copy-Item app/src-tauri/binaries/conpty/conpty.dll "$dir/"
          Copy-Item app/src-tauri/binaries/conpty/x64/OpenConsole.exe "$dir/x64/"
          Copy-Item LICENSE, README.md "$dir/"
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$name.zip.sha256" -Value "$hash  $name.zip" -Encoding ascii

      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/blirp-"$VERSION"-"$TARGET".* --clobber

  desktop:
    name: Desktop ${{ matrix.target }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev pkg-config build-essential file patchelf xdg-utils

      # No caches (cargo or pnpm) here: release assets are built from a clean tree.
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target "$TARGET"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build web UI
        run: |
          pnpm -C web install --frozen-lockfile --ignore-scripts
          pnpm -C web build
      - run: pnpm -C app install --frozen-lockfile --ignore-scripts

      - name: Build sidecar (unix)
        if: runner.os != 'Windows'
        run: SKIP_WEB=1 sh scripts/build-sidecar.sh "$TARGET"
      - name: Build sidecar + ConPTY (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build-sidecar.ps1 -Target $env:TARGET -SkipWeb

      # Tauri signs (and notarizes) the app and its sidecar when these are set;
      # export them only when present, since empty values make it try and fail.
      - name: Enable macOS signing (when configured)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE not set; the macOS app is unsigned"
            exit 0
          fi
          vars="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY"
          if [ -n "$APPLE_ID" ]; then vars="$vars APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"; fi
          for v in $vars; do
            eval "val=\$$v"
            { echo "$v<<__BLIRP_EOF__"; echo "$val"; echo "__BLIRP_EOF__"; } >> "$GITHUB_ENV"
          done

      - name: Enable Windows signing (when configured)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $overlay = Join-Path $env:RUNNER_TEMP 'tauri.sign.json'
          if ($env:AZURE_CLIENT_SECRET) {
            cargo install trusted-signing-cli --locked --version 0.11.0
            $cmd = "trusted-signing-cli -e $env:AZURE_SIGNING_ENDPOINT -a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE -d blirp %1"
            @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Depth 5 | Set-Content $overlay
          } elseif ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            [IO.File]::Delete($pfx)
            @{ bundle = @{ windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
            } } } | ConvertTo-Json -Depth 5 | Set-Content $overlay
          } else {
            Write-Output '::warning::no Windows signing secrets; the installers are unsigned'
            exit 0
          }
          "TAURI_SIGN_ARGS=--config $overlay" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Tauri bundles the installers (NSIS + MSI, DMG, deb + rpm + AppImage);
      # the install scripts use the portable assets packaged below.
      - name: Build the desktop app
        shell: bash
        env:
          # Read by trusted-signing-cli through signCommand (Windows, Azure only).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # shellcheck disable=SC2086 # TAURI_SIGN_ARGS is "--config <file>" or empty
          pnpm -C app tauri build --target "$TARGET" ${TAURI_SIGN_ARGS:-}

      - name: Package the desktop app (macOS)
        if: runner.os == 'macOS'
        run: |
          arch=x64
          if [ "$TARGET" = aarch64-apple-darwin ]; then arch=aarch64; fi
          bundle="target/$TARGET/release/bundle"
          mkdir -p dist
          tar -czf "dist/blirp_${VERSION}_${arch}.app.tar.gz" -C "$bundle/macos" blirp.app
          cp "$bundle"/dmg/*.dmg dist/
      - name: Package the desktop app (Linux)
        if: runner.os == 'Linux'
        run: |
          arch=amd64
          if [ "$TARGET" = aarch64-unknown-linux-gnu ]; then arch=aarch64; fi
          bundle="target/$TARGET/release/bundle"
          mkdir -p dist
          cp "$bundle"/appimage/*.AppImage "dist/blirp_${VERSION}_${arch}.AppImage"
          cp "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm dist/
      - name: Package the desktop app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Portable: the desktop exe with its sidecar and ConPTY, the layout
          # install.ps1 and `blirp update` expect.
          $name = "blirp_$($env:VERSION)_x64-portable"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force "$dir/x64" | Out-Null
          Copy-Item "target/$env:TARGET/release/blirp-desktop.exe" "$dir/"
          Copy-Item "app/src-tauri/binaries/blirp-$env:TARGET.exe" "$dir/blirp.exe"
          Copy-Item app/src-tauri/binaries/conpty/conpty.dll "$dir/"
          Copy-Item app/src-tauri/binaries/conpty/x64/OpenConsole.exe "$dir/x64/"
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force $dir
          $bundle = "target/$env:TARGET/release/bundle"
          Copy-Item "$bundle/nsis/*.exe", "$bundle/msi/*.msi" dist/

      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  checksums:
    name: Checksums of the expected assets
    needs: [draft, cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are visible only with write access.
      contents: write
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download release assets
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets
      # Only these names are summed (and so signed): an asset that should
      # not be in the release fails the job instead of being vouched for.
      - name: SHA256SUMS.txt for the expected assets
        run: |
          v=$VERSION
          expected="blirp-$v-x86_64-unknown-linux-gnu.tar.gz blirp-$v-aarch64-unknown-linux-gnu.tar.gz
            blirp-$v-aarch64-apple-darwin.tar.gz blirp-$v-x86_64-apple-darwin.tar.gz
            blirp-$v-x86_64-pc-windows-msvc.zip
            blirp_${v}_aarch64.app.tar.gz blirp_${v}_x64.app.tar.gz
            blirp_${v}_amd64.AppImage blirp_${v}_aarch64.AppImage blirp_${v}_x64-portable.zip
            blirp_${v}_aarch64.dmg blirp_${v}_x64.dmg
            blirp_${v}_amd64.deb blirp_${v}_arm64.deb
            blirp-$v-1.x86_64.rpm blirp-$v-1.aarch64.rpm
            blirp_${v}_x64-setup.exe blirp_${v}_x64_en-US.msi"
          # One name per line, for exact matching.
          # shellcheck disable=SC2086 # split into names on purpose
          printf '%s\n' $expected | sort > expected.txt
          cd assets
          bad=
          while read -r n; do
            [ -f "$n" ] || { echo "::error::missing release asset $n"; bad=1; }
          done < ../expected.txt
          for f in *; do
            case $f in
              # Per-archive checksums, and this workflow's own outputs on a re-run.
              blirp-"$v"-*.sha256 | SHA256SUMS.txt | SHA256SUMS.txt.sig | homebrew-*.rb | winget-*.yaml) continue ;;
            esac
            grep -qxF "$f" ../expected.txt || {
              echo "::error::unexpected release asset $f (delete it, or add it to the expected list)"
              bad=1
            }
          done
          [ -z "$bad" ] || exit 1
          xargs sha256sum < ../expected.txt > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256sums
          path: SHA256SUMS.txt
          if-no-files-found: error

  sign:
    name: Sign SHA256SUMS.txt
    needs: checksums
    runs-on: ubuntu-latest
    # No token, no checkout, no package installs: the only programs that
    # run next to the key are the shell, coreutils and the pinned minisign.
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sha256sums
      - name: Fetch the pinned minisign
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/minisign.tar.gz" "$MINISIGN_URL"
          echo "$MINISIGN_SHA256  $RUNNER_TEMP/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" --warning=no-unknown-keyword minisign-linux/x86_64/minisign
      # `blirp update` and the install scripts verify this signature with
      # packaging/minisign.pub before trusting any checksum. The secret is a
      # base64 minisign secret key (the Tauri signer's format); its password
      # goes in on stdin.
      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; SHA256SUMS.txt cannot be signed and blirp update would refuse the release"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > "$key"
          printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" |
            "$RUNNER_TEMP/minisign-linux/x86_64/minisign" -S -s "$key" -m SHA256SUMS.txt -x SHA256SUMS.txt.sig
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256sums-sig
          path: SHA256SUMS.txt.sig
          if-no-files-found: error

  packaging:
    name: Publish checksums, signature and package manifests
    needs: [draft, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sha256sums*
          merge-multiple: true
          path: signed
      - name: Verify the signature with packaging/minisign.pub
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/minisign.tar.gz" "$MINISIGN_URL"
          echo "$MINISIGN_SHA256  $RUNNER_TEMP/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" --warning=no-unknown-keyword minisign-linux/x86_64/minisign
          "$RUNNER_TEMP/minisign-linux/x86_64/minisign" -V -m signed/SHA256SUMS.txt -x signed/SHA256SUMS.txt.sig -p packaging/minisign.pub
      - name: Download release assets
        run: gh release download "$GITHUB_REF_NAME" --dir assets
      - name: Render Homebrew and winget manifests
        run: sh scripts/render-packaging.sh "$VERSION" assets packaging-out
      - name: Upload
        run: gh release upload "$GITHUB_REF_NAME" signed/SHA256SUMS.txt signed/SHA256SUMS.txt.sig packaging-out/* --clobber
