name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # Line tables are enough for CI backtraces and cut target/ to a fraction:
  # full debug info for clippy, tests and the extra binaries filled the Linux
  # runner's disk (the linker died with a bus error).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  PNPM_VERSION: "12.7.0"

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile --ignore-scripts
      - run: pnpm -C web check
      - run: pnpm -C web test
      - run: pnpm -C web build

  # RustSec advisories, licenses, bans and sources (deny.toml), the license
  # set of THIRD_PARTY_NOTICES (about.toml), and npm advisories of the
  # shipped JavaScript (high and critical fail).
  deps:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_DENY_URL: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      # Same pin as release.yml.
      CARGO_ABOUT_URL: https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
      CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - name: Install cargo-deny and cargo-about
        run: |
          fetch() { # NAME URL SHA256
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$1.tar.gz" "$2"
            echo "$3  $RUNNER_TEMP/$1.tar.gz" | sha256sum -c -
            mkdir "$RUNNER_TEMP/$1"
            tar -xzf "$RUNNER_TEMP/$1.tar.gz" -C "$RUNNER_TEMP/$1" --strip-components 1
            echo "$RUNNER_TEMP/$1" >> "$GITHUB_PATH"
          }
          fetch cargo-deny "$CARGO_DENY_URL" "$CARGO_DENY_SHA256"
          fetch cargo-about "$CARGO_ABOUT_URL" "$CARGO_ABOUT_SHA256"
      - run: cargo deny --locked check advisories licenses bans sources
      - name: THIRD_PARTY_NOTICES accepts every license in the tree
        run: cargo about generate --locked -o /dev/null packaging/about.hbs

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: pnpm audit (production dependencies)
        run: |
          pnpm -C web audit --prod --audit-level high
          pnpm -C app audit --prod --audit-level high

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The runner image's Android SDK, .NET and Haskell toolchains take
      # space the Tauri + workspace build needs.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install Linux build dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev pkg-config build-essential file

      # rust-toolchain.toml pins the version, so new clippy lints land in a
      # deliberate toolchain bump, not a random PR.
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The blirp binary embeds web/dist; build it first so tests exercise the real UI bundle.
      - name: Build web UI
        run: |
          pnpm -C web install --frozen-lockfile --ignore-scripts
          pnpm -C web build

      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: TypeScript bindings are up to date
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p blirp-core export_bindings
          git diff --exit-code -- web/src/lib/api/types.gen.ts

      # install.sh (Linux, macOS) or install.ps1 (Windows) against a fake
      # release on 127.0.0.1, signed with a throwaway key, into a temp home;
      # tampered assets must be refused. minisign makes the test key.
      - name: Install scripts
        shell: bash
        run: |
          case $RUNNER_OS in
            Linux) asset=minisign-0.12-linux.tar.gz sum=9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73 exe=minisign-linux/x86_64/minisign ;;
            macOS) asset=minisign-0.12-macos.zip sum=89000b19535765f9cffc65a65d64a820f433ef6db8020667f7570e06bf6aac63 exe=minisign ;;
            Windows) asset=minisign-0.12-win64.zip sum=37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479 exe=minisign-win64/x86_64/minisign.exe ;;
          esac
          dir=target/minisign
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" "https://github.com/jedisct1/minisign/releases/download/0.12/$asset"
          if command -v sha256sum >/dev/null; then got=$(sha256sum "$dir/$asset"); else got=$(shasum -a 256 "$dir/$asset"); fi
          [ "${got%% *}" = "$sum" ] || { echo "::error::$asset does not match its pinned sha256"; exit 1; }
          case $asset in
            *.zip) unzip -oq "$dir/$asset" -d "$dir" ;;
            *) tar -xzf "$dir/$asset" -C "$dir" --warning=no-unknown-keyword ;;
          esac
          chmod +x "$dir/$exe"
          cargo build --locked -p blirp
          bin=target/debug/blirp
          if [ "$RUNNER_OS" = Windows ]; then bin=$bin.exe; fi
          sh scripts/test-install.sh "$bin" "$dir/$exe"
          if [ "$RUNNER_OS" = Linux ]; then df -h /; fi

  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile --ignore-scripts

      # Browsers are cached per Playwright version; their system libraries
      # come from apt on every run.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm -C web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C web exec playwright install-deps chromium

      # Builds the UI and a debug daemon, then drives it (web/e2e/global-setup.ts).
      - name: Playwright e2e
        env:
          BLIRP_E2E_CHANNEL: chromium
          # Leaves the temp dir with daemon.log for the upload below.
          BLIRP_E2E_KEEP: "1"
        run: pnpm -C web e2e
      - name: Keep the traces and the daemon logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: |
            web/test-results
            /tmp/blirp-e2e-*/daemon.log
            /tmp/blirp-e2e-*/home/logs
          retention-days: 7
          if-no-files-found: ignore
