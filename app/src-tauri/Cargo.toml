[package]
name = "blirp-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "blirp desktop shell (Tauri): starts the daemon and shows its web UI"
publish = false

[lib]
name = "blirp_desktop"
path = "src/lib.rs"

[[bin]]
name = "blirp-desktop"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
blirp-core.workspace = true
# native-tls: with workspace feature unification (`cargo build/test
# --workspace`) iroh turns on reqwest's `rustls-no-provider`, and this crate
# installs no rustls provider, so a rustls-only reqwest client would panic in
# `build()`. reqwest picks native-tls whenever it is compiled in. The daemon
# is loopback HTTP only; the blirp sidecar is built alone and installs ring.
reqwest = { workspace = true, features = ["native-tls"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
