# winget installer manifest. Template: the VERSION and SHA256 placeholders are filled by scripts/render-packaging.sh.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: blirp.blirp
PackageVersion: {{VERSION}}
MinimumOSVersion: 10.0.17763.0
InstallerType: nullsoft
Scope: user
InstallModes:
  - interactive
  - silent
UpgradeBehavior: install
Protocols:
  - blirp
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/backyarddd/blirp/releases/download/v{{VERSION}}/blirp_{{VERSION}}_x64-setup.exe
    InstallerSha256: {{SHA256_NSIS_X64}}
ManifestType: installer
ManifestVersion: 1.6.0