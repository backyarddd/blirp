# cargo-deny: `cargo deny check` (CI job `deny`). The license list is the
# same accepted set as about.toml, which renders THIRD_PARTY_NOTICES for the
# release; change both together.

[graph]
# The release targets; dependencies of other platforms never ship.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails
# the check unless listed here with the reason it does not apply. The ones
# below are "unmaintained" notices only, deep in dependencies blirp cannot
# swap out (no release upstream drops them). Recheck when iroh or tauri move.
ignore = [
  # paste: proc macro, build time only; via iroh > netwatch > netdev > netlink-packet-core.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc macro via iroh (netlink-packet-core); no maintained release of the chain" },
  # proc-macro-error: build time only; via tauri > gtk-rs 0.18 glib-macros (Linux).
  { id = "RUSTSEC-2024-0370", reason = "unmaintained build-time proc macro via tauri's GTK 3 bindings; tauri has no release without them" },
  # unic-*: Unicode tables used by urlpattern in tauri-utils (desktop app only).
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range, via tauri-utils > urlpattern 0.3; no tauri release without it" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common, via tauri-utils > urlpattern 0.3; no tauri release without it" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property, via tauri-utils > urlpattern 0.3; no tauri release without it" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version, via tauri-utils > urlpattern 0.3; no tauri release without it" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident, via tauri-utils > urlpattern 0.3; no tauri release without it" },
]

[licenses]
# Permissive licenses, plus MPL-2.0 (file-level copyleft: blirp ships those
# crates unmodified and names their source in THIRD_PARTY_NOTICES).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
